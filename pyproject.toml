[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speckit"
version = "0.1.0"
description = "Spec-Driven Development CLI — build software the right way."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "anthropic>=0.28",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# pip install 'speckit[supabase]'  — enables Supabase pgvector index
supabase = [
    "supabase>=2.4",
    "openai>=1.30",
]
# pip install 'speckit[server]'  — enables webhook server (speckit serve)
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
# pip install 'speckit[mcp]'  — enables Claude Pro MCP integration (speckit mcp)
mcp = [
    "mcp>=1.0",
]
# pip install 'speckit[dev]'  — development + testing tools
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
speckit = "speckit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["speckit*"]
